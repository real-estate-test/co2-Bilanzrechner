<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektrechner · Immobilienentwicklung</title>
<meta name="description" content="Bewertungstool für Immobilienprojekte: Erwerb, Baukosten nach BKP, Erträge, Verwertung, Finanzierung und Portfolio-Tracking.">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app/style.css">
</head>
<body>

<div id="app">

  <aside id="nav">
    <div class="brand">
      <span>Projektrechner</span>
      <b>Immobilienentwicklung</b>
    </div>

    <div class="navblock">
      <label for="projektwahl">Projekt</label>
      <select id="projektwahl"></select>
    </div>

    <div class="navblock">
      <label>Detailtiefe</label>
      <div class="seg" id="stufenwahl" style="width:100%">
        <button data-stufe="schnell" title="Nur die wesentlichen Felder">Schnell</button>
        <button data-stufe="standard" title="Übliche Bearbeitungstiefe">Standard</button>
        <button data-stufe="detail" title="Alle Positionen">Detail</button>
      </div>
    </div>

    <nav id="seiten"></nav>

    <div class="navfoot">
      <button id="btn-neu" class="schreibend">+ Neues Projekt</button>
      <button id="btn-duplizieren" class="schreibend">Duplizieren</button>
      <button id="btn-export">Export / Import</button>
    </div>

    <div id="kontoleiste"></div>
  </aside>

  <main>
    <header id="kpibar"></header>
    <div id="warnbar"></div>
    <section id="inhalt"></section>
  </main>

</div>

<script src="app/config.js"></script>
<script src="app/model.js"></script>
<script src="app/engine.js"></script>
<script src="app/api.js"></script>
<script src="app/store-server.js"></script>
<script src="app/ui.js"></script>
<script src="app/auth.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app/verkauf.js"></script>
<script src="app/karte.js"></script>
<script src="app/views.js"></script>
<script src="app/results.js"></script>
<script src="app/portfolio.js"></script>
<script src="app/protokoll.js"></script>
<script src="app/admin.js"></script>
<script src="app/main.js"></script>
</body>
</html>
