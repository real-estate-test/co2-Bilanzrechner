<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektrechner · Selbsttest Rechenkern</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #10151c; padding: 24px; font-size: 14px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #6b7484; margin-bottom: 18px; }
  table { border-collapse: collapse; width: 100%; max-width: 1000px; background: #fff;
          border: 1px solid #e2e6ec; border-radius: 7px; overflow: hidden; }
  th, td { padding: 7px 11px; border-bottom: 1px solid #eef1f5; text-align: left; }
  th { background: #fafbfc; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b7484; }
  td.n { text-align: right; font-family: ui-monospace, monospace; }
  .ok { color: #0d7a45; font-weight: 600; }
  .no { color: #c02e26; font-weight: 600; }
  tr.no td { background: #fdf0ef; }
  #summe { margin: 16px 0; padding: 11px 14px; border-radius: 7px; font-weight: 600; max-width: 1000px; }
</style>
</head>
<body>
<h1>Selbsttest Rechenkern</h1>
<p class="sub">Prüft die Kernrechnungen gegen von Hand nachvollziehbare Referenzwerte.</p>
<div id="summe"></div>
<table><thead><tr>
  <th>Prüfung</th><th class="n">erwartet</th><th class="n">berechnet</th><th>Ergebnis</th>
</tr></thead><tbody id="tb"></tbody></table>

<script src="../app/model.js"></script>
<script src="../app/engine.js"></script>
<script>
(function () {
  var A = window.APP, E = A.engine, tb = document.getElementById('tb');
  var gut = 0, schlecht = 0;

  function pruefe(name, erwartet, ist, toleranz) {
    toleranz = toleranz === undefined ? 0.5 : toleranz;
    var ok = Math.abs(erwartet - ist) <= toleranz;
    ok ? gut++ : schlecht++;
    var tr = document.createElement('tr');
    if (!ok) tr.className = 'no';
    tr.innerHTML = '<td>' + name + '</td>' +
      '<td class="n">' + A.fmt(erwartet, 2) + '</td>' +
      '<td class="n">' + A.fmt(ist, 2) + '</td>' +
      '<td class="' + (ok ? 'ok' : 'no') + '">' + (ok ? 'bestanden' : 'ABWEICHUNG') + '</td>';
    tb.appendChild(tr);
  }

  /* ---- Flächenkaskade ------------------------------------------- */
  var p = A.defaultProject();
  p.grundstueck.flaeche = 2500; p.grundstueck.az = 0.90; p.grundstueck.geschosse = 4;
  var r = E.compute(p);
  pruefe('zulässige aGF = 2500 × 0.90', 2250, r.flaechen.agf_zulaessig);
  pruefe('Gebäudegrundfläche = aGF ÷ 4 Vollgeschosse', 562.5, r.flaechen.total.grundflaeche, 0.01);
  pruefe('GF oberirdisch = aGF × 1.00', 2250, r.flaechen.teile.neubau.gf_oi);
  pruefe('Untergeschoss = Grundfläche × 80 %', 450, r.flaechen.total.gf_ug, 0.01);
  pruefe('NWF = GF o.i. × 78 %', 1755, r.flaechen.total.nwf, 0.01);
  pruefe('Umgebung = Grundstück − Grundfläche', 1937.5, r.flaechen.umgebung, 0.01);
  pruefe('Höhe o.i. = 4 × 3.00 (Attika anrechenbar)', 12.0, r.flaechen.teile.neubau.hoehe_oi, 0.001);
  pruefe('Volumen o.i. = Grundfläche × 4 × 3.00', 562.5 * 4 * 3, r.flaechen.total.gv_oi, 0.1);

  /* Ausnutzungsbonus und nicht anrechenbares Attikageschoss */
  var pb = A.defaultProject();
  pb.grundstueck.flaeche = 2500; pb.grundstueck.az = 0.90; pb.grundstueck.az_bonus = 10;
  pb.grundstueck.geschosse = 4;
  pb.grundstueck.attika_anrechenbar = false; pb.grundstueck.attika_pct = 60;
  var rbn = E.compute(pb), ob = rbn.flaechen.teile.neubau;
  pruefe('aGF mit 10 % Bonus = 2500 × 0.90 × 1.10', 2475, rbn.flaechen.agf_zulaessig, 0.01);
  pruefe('Gebäudegrundfläche ohne Attika = aGF ÷ 4', 618.75, ob.grundflaeche, 0.01);
  pruefe('Attika = Grundfläche × 60 %', 371.25, ob.attika, 0.01);
  pruefe('GF o.i. = aGF + Attika', 2475 + 371.25, ob.gf_oi, 0.01);
  pruefe('Umgebung bleibt ohne Attika', 2500 - 618.75, rbn.flaechen.umgebung, 0.01);
  pruefe('Höhe o.i. = 4 × 3.00 + 3.20', 15.2, ob.hoehe_oi, 0.001);
  pruefe('Volumen o.i. = Vollgeschosse + Attika',
    618.75 * 4 * 3 + 371.25 * 3.2, ob.gv_oi, 0.5);

  /* Phasendauern in Monaten */
  var pz = A.defaultProject();
  pz.zeit.dauer_entwicklung = 18; pz.zeit.dauer_bewilligung = 12;
  pz.zeit.dauer_vorbereitung = 3; pz.zeit.dauer_bau = 24;
  var Z = E.zeitachse(pz);
  pruefe('18 Monate Entwicklung = 1.5 Jahre', 1.5, Z.t_baueingabe, 0.001);
  pruefe('Baubewilligung nach 30 Monaten', 2.5, Z.t_bb, 0.001);
  pruefe('Bauende nach 57 Monaten', 57 / 12, Z.t_bauende, 0.001);

  /* aGF direkt statt über die Ziffer */
  var pa = A.defaultProject();
  pa.grundstueck.az_modus = 'agf'; pa.grundstueck.agf_direkt = 1800;
  pruefe('aGF direkt eingetragen', 1800, E.compute(pa).flaechen.agf_zulaessig);

  /* Einstellhalle über Fläche je Parkplatz */
  var pp = A.defaultProject();
  pp.teile.neubau.pp = 20; pp.teile.neubau.flaeche_pro_pp = 30;
  var rp = E.compute(pp);
  pruefe('Einstellhalle = 20 PP × 30 m²', 600, rp.flaechen.total.f_aeh);
  pruefe('Volumen Einstellhalle = 600 × 3.40', 2040, rp.flaechen.total.gv_aeh, 0.1);

  /* ---- Erwerbsnebenkosten --------------------------------------- */
  var q = A.defaultProject();
  q.erwerb.preis_modus = 'total'; q.erwerb.preis_total = 4000000;
  q.erwerb.handaenderung = 2.00; q.erwerb.handaenderung_anteil = 50;
  q.erwerb.courtage = 2.00; q.erwerb.notariat = 0.20;
  var rq = E.compute(q);
  function pos(res, id) {
    var z = res.erwerb.zeilen.find(function (x) { return x.id === id; });
    return z ? z.betrag : 0;
  }
  pruefe('Handänderungssteuer 2 % × 50 % von 4 Mio.', 40000, pos(rq, 'handaenderung'));
  pruefe('Courtage 2 % von 4 Mio.', 80000, pos(rq, 'courtage'));
  pruefe('Entwicklungshonorar = 2.50 % der Anlagekosten',
    rq.kpi.anlagekosten * 0.025, pos(rq, 'entwicklung'), 600);

  /* ---- Kaufpreiseingabearten ------------------------------------ */
  var m = A.defaultProject();
  m.grundstueck.flaeche = 2000; m.grundstueck.az = 1.0;
  m.erwerb.preis_modus = 'm2_land'; m.erwerb.preis_m2_land = 1500;
  pruefe('Kaufpreis über CHF/m² Land', 3000000, E.compute(m).erwerb.kaufpreis);
  m.erwerb.preis_modus = 'm2_agf'; m.erwerb.preis_m2_agf = 1800;
  pruefe('Kaufpreis über CHF/m² aGF', 3600000, E.compute(m).erwerb.kaufpreis);

  /* ---- Baukosten: Kostengruppen und Prozentkette ---------------- */
  var b = A.defaultProject();
  b.grundstueck.geschosse = 4;
  var t = b.teile.neubau;
  t.pp = 20;
  t.nutzungen = [
    A.defNutzung({ bezeichnung: 'Wohnen STWE', art: 'wohnen', anteil: 60, preis: 10000, verwertung: 'stwe' }),
    A.defNutzung({ bezeichnung: 'Wohnen Miete', art: 'wohnen', anteil: 25, miete: 300, verwertung: 'halten_vermietet' }),
    A.defNutzung({ bezeichnung: 'Gewerbe', art: 'gewerbe', anteil: 15, miete: 200, verwertung: 'halten_vermietet' }),
    A.defNutzung({ bezeichnung: 'PP Verkauf', art: 'parkplatz', anteil: 100, preis: 45000, verwertung: 'stwe' })
  ];
  var rb = E.compute(b), bl = rb.bau.bloecke.neubau, gfoi = rb.flaechen.teile.neubau.gf_oi;
  pruefe('Kostengruppe STWE = GF o.i. × 60 %', gfoi * 0.60, rb.flaechen.gruppen.oi_stwe, 0.1);
  pruefe('Kostengruppe Miete = GF o.i. × 25 %', gfoi * 0.25, rb.flaechen.gruppen.oi_miete, 0.1);
  pruefe('Kostengruppe Gewerbe = GF o.i. × 15 %', gfoi * 0.15, rb.flaechen.gruppen.oi_gewerbe, 0.1);

  function zeile(res, bid, id) {
    var z = res.bau.bloecke[bid].zeilen.find(function (x) { return x.id === id; });
    return z || { betrag: 0, menge: 0 };
  }
  pruefe('BKP 20–29 STWE = Menge × Kennwert',
    rb.flaechen.gruppen.oi_stwe * 3200, zeile(rb, 'neubau', 'b2_oi_stwe').betrag, 1);
  pruefe('BKP 202 Reserve = 3 % der Summe BKP 20–29',
    zeile(rb, 'neubau', 'b2_reserve').menge * 0.03, zeile(rb, 'neubau', 'b2_reserve').betrag, 1);
  pruefe('BKP 599 PM = 2 % von BKP 1–5',
    zeile(rb, 'neubau', 'b5_pm').menge * 0.02, zeile(rb, 'neubau', 'b5_pm').betrag, 1);
  pruefe('Blocksumme = Summe der Gruppen',
    bl.bkp1 + bl.bkp2 + bl.bkp3 + bl.bkp4 + bl.bkp5 + bl.bkp9, bl.summe, 1);

  /* ---- Verwertung: keine Sollmiete auf verkauften Flächen -------- */
  var nwf = rb.flaechen.total.nwf;
  pruefe('Sollmiete nur aus Miet-/Exit-Flächen',
    nwf * 0.25 * 300 + nwf * 0.15 * 200, rb.ertraege.sollmiete, 1);
  pruefe('STWE-Erlös = Fläche × Preis + Parkplätze',
    nwf * 0.60 * 10000 + 20 * 45000, rb.ertraege.stwe_erloes, 1);
  pruefe('Ertragsflächenanteil = 40 % der NWF', 0.40, rb.kpi.anteil_ertrag, 0.001);

  var h = A.defaultProject();
  h.teile.neubau.nutzungen = [A.defNutzung({ bezeichnung: 'Gewerbe Exit', art: 'gewerbe',
    anteil: 100, miete: 400, verwertung: 'exit', exit_rendite: 4.00 })];
  var rh = E.compute(h);
  pruefe('Exit-Wert = Sollmiete / 4 %', rh.flaechen.total.nwf * 400 / 0.04, rh.ertraege.exit_wert, 5);
  pruefe('Exit zählt nicht zum STWE-Erlös', 0, rh.ertraege.stwe_erloes);

  /* ---- Betrieb ohne gehaltene Flächen ---------------------------- */
  var s0 = A.defaultProject();
  pruefe('kein Betriebsaufwand ohne gehaltene Fläche', 0, E.compute(s0).betrieb.total_a);

  /* ---- Zeitverteilung -------------------------------------------- */
  var summe = E.spread(1000000, 1.0, 3.0, 6, 's').reduce(function (a, c) { return a + c; }, 0);
  pruefe('S-Kurve verteilt den Betrag vollständig', 1000000, summe, 0.01);
  pruefe('lineare Verteilung: erstes Jahr = 25 %', 250000, E.spread(1000000, 0, 4, 6, 'linear')[0], 0.01);

  /* ---- Finanzierung ---------------------------------------------- */
  var f = A.defaultProject();
  f.finanzierung.vorverkauf_quote = 55;
  pruefe('Zinsrabatt bei 55 % Vorverkauf', 50, E.compute(f).fin.rabatt_bp);
  f.finanzierung.vorverkauf_quote = 10;
  pruefe('kein Rabatt bei 10 % Vorverkauf', 0, E.compute(f).fin.rabatt_bp);

  var g = A.defaultProject();
  g.finanzierung.ek_einsatz = 'proportional'; g.finanzierung.ek_quote = 30;
  var rg = E.compute(g), j0 = rg.fin.jahre[0];
  pruefe('Eigenkapitalanteil im ersten Jahr = 30 % des Saldos', j0.saldo * 0.30, j0.ek, 1);

  pruefe('IRR von −1000 → 1331 nach 3 Jahren ≈ 10 %', 10, E.irr([-1000, 0, 0, 1331]), 0.6);

  /* ---- Residualwert ---------------------------------------------- */
  var res = A.engine.residualwert(A.defaultProject(), 15);
  var probe = A.defaultProject();
  probe.erwerb.preis_modus = 'total'; probe.erwerb.preis_total = res.preis;
  pruefe('beim Residualpreis wird die Zielmarge erreicht', 15,
    E.compute(probe).kpi.marge_ak, 0.15);

  /* ---- Gewinnidentität -------------------------------------------- */
  var k = E.compute(A.defaultProject()).kpi;
  pruefe('Erlöse − alle Kosten − Steuern = Gewinn',
    k.erloese + k.mietertrag_projekt - k.erwerbskosten - k.baukosten -
    k.finanzierungskosten - k.vermarktung - k.steuern, k.gewinn, 2);

  /* ---- Wohnungsspiegel speist die Nutzungszeilen ------------------- */
  var ps = A.defaultProject();
  var zStwe = A.defNutzung({ bezeichnung: 'Wohnen STWE', art: 'wohnen', anteil: 70,
    preis: 9000, verwertung: 'stwe' });
  var zMiete = A.defNutzung({ bezeichnung: 'Wohnen Miete', art: 'wohnen', anteil: 30,
    miete: 300, verwertung: 'halten_vermietet' });
  ps.teile.neubau.nutzungen = [zStwe, zMiete];
  ps.spiegel.aktiv = true; ps.spiegel.teil = 'neubau';
  ps.spiegel.einheiten = [
    { nr: '1', flaeche: 100, preis: 1000000, zeile: zStwe.id },
    { nr: '2', flaeche: 120, preis: 1160000, zeile: zStwe.id },
    { nr: '3', flaeche: 80,  preis: 0,       zeile: zMiete.id }
  ];
  var rs = E.compute(ps), os = rs.flaechen.teile.neubau;
  pruefe('Spiegel setzt Fläche der STWE-Zeile', 220, os.nutzungen[zStwe.id], 0.01);
  pruefe('Spiegel setzt Fläche der Mietzeile', 80, os.nutzungen[zMiete.id], 0.01);
  pruefe('Durchschnittspreis der STWE-Zeile aus dem Spiegel',
    2160000 / 220, os.spiegel[zStwe.id].preis_m2, 0.01);
  pruefe('STWE-Erlös folgt dem Spiegel', 2160000, rs.ertraege.stwe_erloes, 1);
  pruefe('Mietzeile bleibt Sollmiete', 80 * 300, rs.ertraege.sollmiete, 1);

  /* ---- Migration Schema 1 -> 2 ------------------------------------ */
  var altprojekt = {
    schema: 1, id: 'palt', name: 'Alt', stufe: 'standard', szenario: 'neubau',
    erwerbsart: 'kauf', meta: {}, startjahr: 2024,
    grundstueck: { flaeche: 3000, az: 1.0, umgebung_anteil: 50 },
    teile: { neubau: { aktiv: true, modus: 'ausnutzung', gf_ug: 400, pp: 10,
        pp_miete: 150, pp_preis: 40000, pp_verwertung: 'stwe', faktor_gf: 1.1, hnf_quote: 78,
        nutzungen: { wohnen: { anteil: 100, miete: 320, preis: 9800, verwertung: 'stwe' } } },
      bestand: { aktiv: false }, erweiterung: { aktiv: false } },
    bau: { neubau: { aktiv: true, reserve: 5, zeilen: { b2_rohbau: { aktiv: true, basis: 'gf', wert: 1150 } } } },
    snapshots: [], ist: {}
  };
  var mig = A.migrate(JSON.parse(JSON.stringify(altprojekt)));
  pruefe('Migration: Nutzungen sind eine Liste', 1, Array.isArray(mig.teile.neubau.nutzungen) ? 1 : 0);
  pruefe('Migration: Wohnen + Parkplätze übernommen', 2, mig.teile.neubau.nutzungen.length);
  pruefe('Migration: Startdatum aus Startjahr', 2024, parseInt(mig.startdatum.slice(0, 4), 10));
  pruefe('Migration: Umgebungsfläche festgeschrieben', 1500, mig.grundstueck.umgebung_manuell);
  pruefe('Migration: Projekt rechnet weiterhin', 1, E.compute(mig).kpi.anlagekosten > 0 ? 1 : 0);

  /* ---- Zusammenfassung -------------------------------------------- */
  var box = document.getElementById('summe');
  box.textContent = gut + ' von ' + (gut + schlecht) + ' Prüfungen bestanden' +
    (schlecht ? ' — ' + schlecht + ' Abweichung(en)' : '');
  box.style.background = schlecht ? '#fdf0ef' : '#edf7f1';
  box.style.color = schlecht ? '#8c2b23' : '#0d5c34';
})();
</script>
</body>
</html>
